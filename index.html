<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generate SKRD</title>
<meta name="theme-color" content="#152a63">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #splash {
    text-align: center;
    color: #152a63;
  }
  #splash img {
    width: 120px;
    height: 120px;
    margin-bottom: 16px;
  }
  .spinner {
    margin: 16px auto 0;
    width: 32px;
    height: 32px;
    border: 4px solid #d9d9d9;
    border-top: 4px solid #152a63;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="Generate SKRD">
    <div>Membuka Generate SKRD...</div>
    <div class="spinner"></div>
  </div>

<script>
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzqSaOe5IUinDlVIuRIOjswFyvlejah0i_clJr9KkQ9NPo2S1FtP7AUHXTe-FXjNmxK/exec';

  // Register service worker dulu (biar PWA installable)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Google Apps Script block iframe, jadi redirect top-level, bukan embed
  setTimeout(() => {
    window.location.replace(APP_URL);
  }, 600);
</script>
</body>
</html>
